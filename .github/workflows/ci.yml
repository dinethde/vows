name: CI

on:
  pull_request:
    branches: [dev-v2, main]
  push:
    branches: [dev-v2]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Turbo only runs what the diff touched. A copy change does not rebuild
      # the worker.
      - run: pnpm turbo run lint typecheck test --filter=...[origin/${{ github.base_ref || 'dev-v2' }}]

      - run: pnpm turbo run build --filter=...[origin/${{ github.base_ref || 'dev-v2' }}]

  e2e:
    name: playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vows/web exec playwright install --with-deps chromium
      - run: pnpm --filter @vows/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  prose:
    name: commit and pull request prose
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: commitlint
        run: pnpm exec commitlint --from origin/${{ github.base_ref }} --to HEAD --verbose

      # The same three checks the commit-msg hook runs, against the pull
      # request's own title and body. Rules in .claude/skills/writing-commits.
      - name: title and body
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          TEXT="$PR_TITLE
          $PR_BODY"

          fail() { echo "::error::$1"; exit 1; }

          echo "$TEXT" | grep -qiE 'co-authored-by:.*(claude|copilot|cursor|gpt|codex|bot)|generated with|🤖' \
            && fail "no tool attribution. See .claude/skills/writing-commits."

          echo "$TEXT" | grep -qiE '\b(comprehensive|robust|seamless(ly)?|streamline[sd]?|leverage[sd]?|utilize[sd]?|delve|cutting-edge|performant)\b' \
            && fail "filler word in the title or body. Say what actually changed."

          echo "$TEXT" | grep -qiE '^[[:space:]]*(this commit|this change|this pr)\b' \
            && fail "drop 'this PR' — just say what it does."

          [ -z "$(echo "$PR_BODY" | tr -d '[:space:]')" ] \
            && fail "empty description. Four questions, in prose."

          echo "ok"
