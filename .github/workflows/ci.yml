name: CI

on:
  pull_request:
    branches: [dev-v2, main]
  push:
    branches: [dev-v2]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1
  # The public pages are built ahead of time, so the build reads the staging
  # API. None of these is a secret.
  API_URL: ${{ vars.STAGING_API_URL }}
  NEXT_PUBLIC_API_URL: ${{ vars.STAGING_API_URL }}
  NEXT_PUBLIC_SITE_URL: ${{ vars.STAGING_SITE_URL }}
  NEXT_PUBLIC_MEDIA_URL: ${{ vars.STAGING_MEDIA_URL }}

# Checks read the repository; nothing in CI writes to it.
permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    name: tokens · lint · typecheck · unit · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # A generated file edited by hand cannot merge: the rebuild must match.
      - name: tokens are what the build writes
        run: pnpm tokens:build && git diff --exit-code packages/tokens

      - run: pnpm turbo run lint typecheck test
      - run: pnpm exec prettier --check .
      # The web app builds in the integration job, where an API is running:
      # its pages are made from the published albums at build time.
      - run: pnpm turbo run build --filter='!@vows/web'

  integration:
    name: integration and web build, on its own Neon branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A fork cannot read the secret, and must not be able to.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: create a database branch for this run
        id: branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: ci-${{ github.run_id }}-${{ github.run_attempt }}
          parent_branch: main
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: migrate
        env:
          DATABASE_URL: ${{ steps.branch.outputs.db_url }}
        run: pnpm db:migrate

      - name: server tests, against real Postgres
        env:
          DATABASE_URL: ${{ steps.branch.outputs.db_url_pooled }}
        run: pnpm turbo run test --filter=@vows/server

      # The web build reads the published albums from the API, so a real API
      # runs on this run's database. Nothing here is a secret: the values are
      # placeholders for services the build never calls.
      - name: start the API on this run's database
        env:
          DATABASE_URL: ${{ steps.branch.outputs.db_url_pooled }}
          APP_ENV: local
          PORT: "3001"
          LOG_LEVEL: warn
          CLERK_ISSUER: https://clerk.ci.invalid
          CLERK_JWKS_URL: https://clerk.ci.invalid/.well-known/jwks.json
          WEB_ORIGINS: http://localhost:3000
          SITE_URL: http://localhost:3000
          MEDIA_URL: https://media.ci.invalid
          R2_ACCOUNT_ID: ci
          R2_ACCESS_KEY_ID: ci
          R2_SECRET_ACCESS_KEY: ci
          R2_BUCKET_ORIGINALS: ci
          R2_BUCKET_PUBLIC: ci
          REVALIDATE_SECRET: ci-only-revalidate-placeholder-0123456789
          IP_HASH_SALT: ci-only-salt-0123
        run: |
          pnpm turbo run build --filter=@vows/api...
          nohup node apps/api/dist/main.js > api.log 2>&1 &
          curl --fail --silent --retry 20 --retry-delay 2 --retry-all-errors http://localhost:3001/healthz

      - name: build the web app against it
        env:
          API_URL: http://localhost:3001
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_MEDIA_URL: https://media.ci.invalid
        run: pnpm turbo run build --filter=@vows/web

      - name: the API's log, when something failed
        if: failure()
        run: tail -50 api.log || true

      - name: drop the branch
        if: always()
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ci-${{ github.run_id }}-${{ github.run_attempt }}
          api_key: ${{ secrets.NEON_API_KEY }}

  e2e:
    name: playwright and axe, against staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Until staging is deployed there is nothing to test against; the variable
    # is set the day it is.
    if: vars.STAGING_SITE_URL != ''
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vows/web exec playwright install --with-deps chromium webkit
      - run: pnpm --filter @vows/web test:e2e
        env:
          E2E_BASE_URL: ${{ vars.STAGING_SITE_URL }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  audit:
    name: dependencies and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm audit --prod --audit-level high
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    # The API and worker are only ever built as images on Fly. Building them
    # here means a broken Dockerfile fails the pull request, not the deploy.
    name: api and worker images build and start
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        app: [api, worker]
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: docker build -f apps/${{ matrix.app }}/Dockerfile -t vows-${{ matrix.app }} .
      - name: the image refuses to start without its configuration
        # It must exit with the config error, not a missing module.
        run: |
          set +e
          output=$(docker run --rm vows-${{ matrix.app }} 2>&1)
          status=$?
          echo "$output" | tail -5
          test $status -ne 0
          echo "$output" | grep -q "Invalid environment. Refusing to start."

  prose:
    name: commit and pull request prose
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: commitlint
        run: pnpm exec commitlint --from origin/${{ github.base_ref }} --to HEAD --verbose

      # The same three checks the commit-msg hook runs, against the pull
      # request's own title and body. Rules in .claude/skills/writing-commits.
      - name: title and body
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          TEXT="$PR_TITLE
          $PR_BODY"

          fail() { echo "::error::$1"; exit 1; }

          echo "$TEXT" | grep -qiE 'co-authored-by:.*(claude|copilot|cursor|gpt|codex|bot)|generated with|🤖' \
            && fail "no tool attribution. See .claude/skills/writing-commits."

          echo "$TEXT" | grep -qiE '\b(comprehensive|robust|seamless(ly)?|streamline[sd]?|leverage[sd]?|utilize[sd]?|delve|cutting-edge|performant)\b' \
            && fail "filler word in the title or body. Say what actually changed."

          echo "$TEXT" | grep -qiE '^[[:space:]]*(this commit|this change|this pr)\b' \
            && fail "drop 'this PR' — just say what it does."

          [ -z "$(echo "$PR_BODY" | tr -d '[:space:]')" ] \
            && fail "empty description. Four questions, in prose."

          echo "ok"
